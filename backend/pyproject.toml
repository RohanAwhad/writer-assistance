[project]
name = "writer-assistance-backend"
version = "0.1.0"
description = "Backend milestone (1 of 3) for the writer-assistance webapp"
requires-python = ">=3.13"
dependencies = [
    "anthropic[vertex]>=0.69",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_ai: env-gated tests calling the real AnthropicVertex backend (require RUN_LIVE_AI=1 and RES-001 env vars)",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
