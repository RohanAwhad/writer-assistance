      run_context: "Local single-user (Recommended)"
    proposal_ref: A2
  H15:
    actor: human
    type: direct_instruction
    source_ref: msg_0677af454001dyz36ynIRQ7lU4
    quote: >
      And also make sure to have tests or verifications, manual and
      automatic tests, and use cases in the spec.
  H16:
    actor: human
    type: direct_instruction
    source_ref: msg_0678593fd001q9If05MWgwlux4
    quote: >
      next up, I would like you to spin builder and reviewer, which will go
      in loop one after another. builder will build based on the spec that
      was created, and reviewer will also review based on that. they will
      loop till either reviewer is satisfied with the built output, or
