      2-way door is mistakes you can rectify, so in this scenario, go ahead
      with the best possible decision that you can make, and then if I dont
      like it, or in future we want to choose something else, we can.
  A1:
    actor: agent
    type: proposal
    source_ref: msg_06775e488001a2akEgrYKJVif2
    summary: >
      Asked how to treat origin/main (which holds a working v1 "Writer's
      Desk" of the same app): reconcile spec with main / answer OQs
      abstractly / treat main as stale; and whether to push the two local
      commits on built-using-hai.
  H13:
    actor: human
    type: explicit_selection
    source_ref: msg_06775e488001a2akEgrYKJVif2
    selections:
      push_commits: "Yes, push built-using-hai"
    proposal_ref: A1
  A2:
    actor: agent
    type: proposal
    source_ref: msg_067793ca7001bOU0fVbn6nY1aB
    summary: >
      One-way-door questions: where resource markdown files live (reference
