  H3:
    actor: human
    type: direct_instruction
    source_ref: msg_06754c37e001N0Ql8A1Vc0UB6r
    quote: >
      So in this project, i want to create a new webapp that will help me
      with writing. Writing blogs/articles, letters, reports and docs.
  H4:
    actor: human
    type: direct_instruction
    source_ref: msg_06754c37e001N0Ql8A1Vc0UB6r
    quote: >
      The way I want it to be is, there will be projects, and inside each
