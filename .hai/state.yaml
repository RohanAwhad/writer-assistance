      OQ-02..06 resolutions were proposed agent-side (multi-round per
      project, typed-entry dump, minimal export, one-shot generation,
      AI-proposed lenses only).
  H14:
    actor: human
    type: explicit_selection
    source_ref: msg_067793ca7001bOU0fVbn6nY1aB
    selections:
