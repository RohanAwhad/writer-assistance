          evidence: [H9]

    - id: INT-005
      scope: session_workflow
      lifecycle: completed
      statement: >
        Produce spec.md for the writing-assistance app, resolve its open
        questions with the human, and iterate until the spec-reviewer
        approves compliance with .hai human intent and decisions.
      evidence: [H10, H11, H15, A2]
      instructions:
        - id: INS-001
          statement: >
            Run spec-writer and spec-reviewer subagents in a loop until the
            reviewer says the spec is in compliance with human intent and
            decisions; agent assumptions are malleable and may be changed;
            conflicting human decisions or unsatisfiable constraints are
