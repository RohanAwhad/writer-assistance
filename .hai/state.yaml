human_approved:
  intents:
    - id: INT-001
      scope: project
      lifecycle: active
      statement: >
        Build a writing-assistance webapp for blogs/articles, letters,
        reports and docs.
      evidence: [H1, H2, H3]
      decisions:
        - id: DEC-001
          statement: Use a Python FastAPI backend.
          evidence: [H1]
        - id: DEC-002
          statement: Use React with shadcn/ui for the frontend.
          evidence: [H1]
        - id: DEC-003
          statement: Use SQLite as the database for now.
          evidence: [H1]
        - id: DEC-004
          statement: >
            Use the AnthropicVertex client for all AI calls, with
            credentials read from existing env vars in ~/.zshrc.
          evidence: [H2]
        - id: DEC-014
          statement: >
            The app runs locally on the human's machine as a single user;
            no authentication, no hosting.
          evidence: [H14]
        - id: DEC-015
          statement: >
            Runtime config is read from a backend/.env file via
            python-dotenv with override=True; .env takes precedence over
            shell-exported env vars; .env.example documents the names.
          evidence: [H18]
        - id: DEC-017
          statement: >
            Backend AI uses the anthropic[vertex] extra (anthropic[google]
            is invalid for SDK 1.x) and claude-sonnet-5 as the Vertex model
            for live AI runs; the integration subagent's choices are
            retroactively approved by the human.
          evidence: [H21]

    - id: INT-002
      scope: project
      lifecycle: active
      statement: >
        Model writing work as projects containing read-only Markdown
        resource trees that are read and annotated, never edited.
      evidence: [H3, H4]
      decisions:
        - id: DEC-005
          statement: >
            A project contains dirs/files/sub-dirs of Markdown files acting
            as resources.
          evidence: [H4]
        - id: DEC-006
          statement: >
            The human reads resources and makes notes/highlights; resources
            themselves are never edited.
          evidence: [H4]
        - id: DEC-016
          statement: >
            Resource trees are imported into the app at project setup and
            stored as an immutable snapshot in app storage (SQLite);
            external file changes after import are not tracked; resources
            stay read-only.
          evidence: [H14]

    - id: INT-003
      scope: project
      lifecycle: active
      statement: >
        Run a joint human-AI reading pass over a set of docs using
        AI-generated expert lenses whose notes the human can adopt or
        discard, then curate a notes dump.
      evidence: [H3, H5, H6]
      decisions:
        - id: DEC-007
          statement: >
            The AI system reads the resources and proposes relevant expert
            lenses per doc (e.g. financial, real-estate, political,
            software-engineering expert).
          evidence: [H5]
        - id: DEC-008
          statement: >
            Each AI expert keeps its own notes; the human can review and
            discard them or add them (possibly modified) to the human notes.
          evidence: [H5]
        - id: DEC-009
          statement: >
            The human curates the output of the reading round as a dump of
            notes including snippets, highlights, and both human and AI
            thoughts.
          evidence: [H6]

    - id: INT-004
      scope: project
      lifecycle: active
      statement: >
        Generate a report from the curated notes dump, then shift to a
        block-level editor with per-block AI assistance.
      evidence: [H3, H7, H8, H9]
      decisions:
        - id: DEC-010
          statement: >
            A button generates the report from the curated notes dump.
          evidence: [H7]
        - id: DEC-011
          statement: >
            After report creation the app shifts to editor mode where the
            report is edited manually, paragraph by paragraph, with the
            paragraph as the unit block.
          evidence: [H8]
        - id: DEC-012
          statement: >
            Per block the user can request a tone change that makes the AI
            generate 5 samples in different tones using the report context.
          evidence: [H9]
        - id: DEC-013
          statement: >
            Per block the user can have the AI critique and challenge the
            argument to help formulate it better.
          evidence: [H9]

    - id: INT-005
      scope: project
      lifecycle: active
      statement: >
        Provide a view mode for the generated report, alongside the existing
        editing mode.
      evidence: [H22]
      decisions:
        - id: DEC-018
          statement: >
            The report is readable in a non-editing view mode (rendered
            reading surface) as an alternative to the block editor; the
            editing mode remains the typing surface.
          evidence: [H22]

    - id: INT-006
      scope: project
      lifecycle: active
      statement: >
        Run the app as a single containerized webapp locally and expose it
        publicly through a Cloudflare tunnel, protected by an in-app
        API-key login.
      evidence: [H23, H24, H25, H27, H30, H32]
      decisions:
        - id: DEC-019
          statement: >
            The deployment artifact is a single container serving the built
            frontend and the FastAPI backend together; no docker compose.
          evidence: [H25]
        - id: DEC-020
          statement: >
            The app is exposed publicly via a Cloudflare tunnel to the
            public hostname writer.assistance.rohanawhad.com; the hostname
            is reserved for the app container (the mission-control viewer
            is not served on it).
          evidence: [H24, H34]
        - id: DEC-021
          statement: >
            The container enforces a minimal password/API-key gate; a key
            was generated and stored as AUTH_API_KEY in backend/.env
            (gitignored) and shown to the human so the browser can log in
            once.
          evidence: [H27]
        - id: DEC-022
          statement: >
            The gate is a custom login screen served by the app with a
            session cookie, not browser Basic Auth.
          evidence: [H32]
        - id: DEC-023
          statement: >
            The container starts with a fresh database stored on a named
            Docker volume, not the existing local data.
          evidence: [H30]

    - id: INT-007
      scope: project
      lifecycle: active
      statement: >
        Support multiple live AI providers behind the app's AI boundary —
        the existing AnthropicVertex path and DeepSeek (OpenAI-compatible)
        — with an in-app option to select which provider is used.
      evidence: [H26, H28, H29, H31, H33]
      decisions:
        - id: DEC-024
          statement: >
            Keep the AnthropicVertex provider and add DeepSeek as a second
            live provider (model deepseek-v4-flash, OpenAI-compatible),
            selectable instead of claude-sonnet-5.
          evidence: [H26, H31]
        - id: DEC-025
          statement: >
            DeepSeek is reached at the api.deepseek.com endpoint.
          evidence: [H28]
        - id: DEC-026
          statement: >
            The DeepSeek API key is read from the DEEPSEEK_API_KEY env var
            present in the human's ~/.bashrc.
          evidence: [H29]
        - id: DEC-027
          statement: >
            Provider choice is made in-app via a selector, not an
            environment variable.
          evidence: [H33]

agent_context:
  research:
    - id: RES-001
      intent_ids: [INT-001]
      statement: >
        Runtime configuration comes from environment variables, loaded from a
        backend/.env file via python-dotenv with override=True (human decision
        2026-09-03, DEC-015: .env takes precedence over shell-exported vars,
        because the shell's ANTHROPIC_MODEL form 'claude-opus-4-8[1m]' is a
        Claude Code alias invalid for direct Vertex calls). Names:
        ANTHROPIC_VERTEX_PROJECT_ID, ANTHROPIC_MODEL, ANTHROPIC_SMALL_FAST_MODEL,
        GOOGLE_VERTEX_LOCATION (alias VERTEX_LOCATION), VERTEX_ACCESS_TOKEN,
        ANTHROPIC_BASE_URL, ANTHROPIC_CUSTOM_MODEL_OPTION*.
      basis: human_instruction + environment_configuration_inspection
      source_ref: msg_06754d782001f33sBRQfAuGb6O
    - id: RES-002
      intent_ids: [INT-001]
      statement: >
        Live Vertex probes (integration run): model alias forms like
        'claude-opus-4-8[1m]' are rejected (400 INVALID_ARGUMENT);
        'claude-opus-4-8', 'claude-opus-4-8@default' and 'claude-sonnet-5'
        are accepted, 'claude-opus-4-8@latest' is not. Auth works via ADC
        google-auth (no VERTEX_ACCESS_TOKEN needed). The anthropic SDK
        (>=1.x) requires the 'vertex' extra (anthropic[google] does not
        exist). Big-model env (ANTHROPIC_MODEL) routes expert notes and
        report generation; small-fast model (ANTHROPIC_SMALL_FAST_MODEL)
        routes lens proposals, tone samples, critiques.
      basis: live_ai_integration_probe
      source_ref: msg_067ef378f001lYHPKPK63msdSL
    - id: RES-003
      intent_ids: [INT-007]
      statement: >
        This Linux host's shell config (~/.bashrc, not ~/.zshrc) exports
        DEEPSEEK_API_KEY as well as ANTHROPIC_VERTEX_PROJECT_ID and
        ANTHROPIC_* / VERTEX_LOCATION-style vars consistent with RES-001;
        backend/.env (DEC-015) still takes precedence over all shell vars.
      basis: shell_configuration_inspection
      source_ref: msg_069495d66001OqueMzvW2zWFZC

  assumptions:
    - id: ASM-001
      intent_ids: [INT-001]
